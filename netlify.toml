[build]
  publish = "."

# ── This project serves only the jasonkloess.nashvilleluxurylist.com landing page.
# Pages carried over from the main Nashville Luxury List site redirect to their
# live versions on www.nashvilleluxurylist.com (a separate Netlify project).
[[redirects]]
  from   = "/about/*"
  to     = "https://www.nashvilleluxurylist.com/about/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "/about"
  to     = "https://www.nashvilleluxurylist.com/about/"
  status = 301
  force  = true

