backend:
  name: git-gateway
  branch: main

# Where uploaded images/files will be stored
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# ── COLLECTIONS ───────────────────────────────────────────────────────────────
collections:

  # ── FEATURED LISTINGS ──────────────────────────────────────────────────────
  - name: "listings"
    label: "Featured Listings"
    label_singular: "Listing"
    folder: "_data/listings"
    create: true
    slug: "{{slug}}"
    identifier_field: "address"
    summary: "{{address}} — {{price}} ({{status}})"
    fields:
      - { label: "Address",        name: "address",      widget: "string",   hint: "e.g. 7262 Murrell Dr, Franklin, TN" }
      - { label: "Neighborhood",   name: "neighborhood", widget: "select",   options: ["Belle Meade","Brentwood","Green Hills","Franklin","Oak Hill","Forest Hills","12 South","Downtown","Other"] }
      - { label: "Price",          name: "price",        widget: "string",   hint: "e.g. $2,039,900" }
      - { label: "Status",         name: "status",       widget: "select",   options: ["For Sale","Off Market","Under Contract","Sold","Coming Soon"] }
      - { label: "Bedrooms",       name: "beds",         widget: "number",   value_type: "int", min: 1 }
      - { label: "Bathrooms",      name: "baths",        widget: "string",   hint: "e.g. 4.1" }
      - { label: "Square Footage", name: "sqft",         widget: "number",   value_type: "int" }
      - { label: "Short Description", name: "description", widget: "text",  hint: "1–2 sentences shown on the listing card", required: false }
      - { label: "Main Photo",     name: "photo",        widget: "image",    required: false, hint: "Primary listing photo" }
      - { label: "Additional Photos", name: "photos",   widget: "list",     field: { label: "Photo", name: "photo", widget: "image" }, required: false }
      - { label: "Contact Link",   name: "contact_slug", widget: "string",   hint: "e.g. Franklin+Estate — used in the contact form URL", required: false }
      - { label: "Featured on Homepage", name: "featured", widget: "boolean", default: false }
      - { label: "Sort Order",     name: "order",        widget: "number",   value_type: "int", default: 99, hint: "Lower = appears first" }

  # ── NEIGHBORHOODS ──────────────────────────────────────────────────────────
  - name: "neighborhoods"
    label: "Neighborhoods"
    label_singular: "Neighborhood"
    folder: "_data/neighborhoods"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    fields:
      - { label: "Name",           name: "name",         widget: "string" }
      - { label: "Slug",           name: "slug",         widget: "string",   hint: "URL-safe, e.g. belle-meade" }
      - { label: "Tagline",        name: "tagline",      widget: "string",   hint: "Short description shown on card, e.g. Nashville's most prestigious address" }
      - { label: "Average Price",  name: "avg_price",    widget: "string",   hint: "e.g. $3.2M" }
      - { label: "Highlight",      name: "highlight",    widget: "string",   hint: "e.g. Gated Estates" }
      - { label: "Hero Image",     name: "hero_image",   widget: "image",    required: false }
      - { label: "Description",    name: "description",  widget: "markdown", required: false }

  # ── TESTIMONIALS ───────────────────────────────────────────────────────────
  - name: "testimonials"
    label: "Testimonials"
    label_singular: "Testimonial"
    folder: "_data/testimonials"
    create: true
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}} — {{role}}"
    fields:
      - { label: "Client Name",    name: "name",         widget: "string" }
      - { label: "Role / Context", name: "role",         widget: "string",   hint: "e.g. Buyer — Belle Meade" }
      - { label: "Quote",          name: "quote",        widget: "text" }
      - { label: "Rating",         name: "rating",       widget: "number",   value_type: "int", min: 1, max: 5, default: 5 }
      - { label: "Show on Homepage", name: "featured",   widget: "boolean",  default: false }

  # ── SITE SETTINGS ──────────────────────────────────────────────────────────
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Contact Info"
        name: "contact"
        file: "_data/settings/contact.yml"
        fields:
          - { label: "Phone",        name: "phone",        widget: "string" }
          - { label: "Email",        name: "email",        widget: "string" }
          - { label: "Address Line 1", name: "address1",   widget: "string" }
          - { label: "Address Line 2", name: "address2",   widget: "string", required: false }
          - { label: "Instagram URL", name: "instagram",   widget: "string", required: false }
          - { label: "Facebook URL",  name: "facebook",    widget: "string", required: false }
          - { label: "Compass Profile URL", name: "compass", widget: "string", required: false }

      - label: "Hero Banner"
        name: "hero"
        file: "_data/settings/hero.yml"
        fields:
          - { label: "Headline Line 1", name: "headline1",  widget: "string" }
          - { label: "Headline Line 2", name: "headline2",  widget: "string" }
          - { label: "Subheadline",     name: "subheadline", widget: "text" }
          - { label: "Hero Background Image", name: "bg_image", widget: "image", required: false }
          - { label: "Primary CTA Text",  name: "cta1_text", widget: "string" }
          - { label: "Primary CTA URL",   name: "cta1_url",  widget: "string" }
          - { label: "Secondary CTA Text", name: "cta2_text", widget: "string" }
          - { label: "Secondary CTA URL",  name: "cta2_url",  widget: "string" }
